# ปลุก Supabase ทุกวัน ไม่ให้โปรเจกต์ฟรีถูก pause เพราะไม่มีการใช้งาน
name: keepalive
on:
  schedule:
    - cron: '17 1 * * *'   # ทุกวัน 08:17 เวลาไทย
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API (แตะฐานข้อมูลจริง)
        run: |
          curl -fsS --retry 3 --max-time 30 -X POST -H 'Content-Type: text/plain' \
            -d '{"a":"ping"}' https://ujqjgqkjocdtlgvrydae.supabase.co/functions/v1/api
